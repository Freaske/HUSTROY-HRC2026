; Initial target: standard ESP32 Dev Module (ESP32-WROOM family).
; IMPORTANT: Update 'board' after Toan confirms the actual ESP32 model.
[env:esp32dev]
; Pin the installed platform: Arduino-ESP32 3.3.12, pin-based LEDC API.
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
