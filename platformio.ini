[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

[env:esp32dev-bt]
extends = env:esp32dev
build_flags = -DHUSTROY_TEST_BLUETOOTH

[env:esp32dev-wifi]
extends = env:esp32dev
build_flags = -DHUSTROY_TEST_WIFI
